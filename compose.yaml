# rag-ops 1부 1단계: DB(pgvector)와 임베딩 서버(TEI)
# 값은 .env에서 읽는다. .env.example을 복사해서 .env를 만든다.

name: rag-ops

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      # PostgreSQL 18부터 볼륨 위치가 /var/lib/postgresql 로 바뀌었다 (이전: .../data)
      - db-data:/var/lib/postgresql
      # 처음 초기화할 때만 실행된다. 이미 데이터가 있으면 실행되지 않는다
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  embed:
    image: ${TEI_IMAGE}
    command:
      - --model-id=BAAI/bge-m3
      - --revision=${EMBED_MODEL_REVISION}
      # 한 번에 처리할 최대 토큰 수. 클수록 메모리를 많이 잡는다 (기본 16384)
      - --max-batch-tokens=${EMBED_MAX_BATCH_TOKENS}
    ports:
      - "127.0.0.1:${EMBED_PORT}:80"
    volumes:
      # 모델 파일 캐시. 처음 한 번만 내려받는다
      - embed-cache:/data
    restart: unless-stopped

volumes:
  db-data:
  embed-cache:
