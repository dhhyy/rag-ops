# rag-ops: DB(pgvector), 임베딩 서버(TEI), 리랭커(TEI), 작업 대기열(Redis), 엔진 API(FastAPI), 가져오기 worker(Celery)
# 값은 .env에서 읽는다. .env.example을 복사해서 .env를 만든다.

name: rag-ops

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      # PostgreSQL 18부터 볼륨 위치가 /var/lib/postgresql 로 바뀌었다 (이전: .../data)
      - db-data:/var/lib/postgresql
      # 처음 초기화할 때만 실행된다. 이미 데이터가 있으면 실행되지 않는다
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  embed:
    image: ${TEI_IMAGE}
    command:
      - --model-id=BAAI/bge-m3
      - --revision=${EMBED_MODEL_REVISION}
      # 한 번에 처리할 최대 토큰 수. 클수록 메모리를 많이 잡는다 (기본 16384)
      - --max-batch-tokens=${EMBED_MAX_BATCH_TOKENS}
    ports:
      - "127.0.0.1:${EMBED_PORT}:80"
    volumes:
      # 모델 파일 캐시. 처음 한 번만 내려받는다
      - embed-cache:/data
    restart: unless-stopped

  # 리랭커 (TEI). 질문과 후보 조각을 한 쌍씩 읽고 관련도 점수를 매긴다. 질문할 때마다 계산한다 (DB에 저장하지 않는다)
  rerank:
    image: ${TEI_IMAGE}
    command:
      - --model-id=BAAI/bge-reranker-v2-m3
      - --revision=${RERANK_MODEL_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
      - --max-batch-tokens=${RERANK_MAX_BATCH_TOKENS:-4096}
      # 질문+조각이 한도를 넘으면 오류 대신 뒤를 자른다. 잘린 조각은 뒷부분이 점수에 반영되지 않는다
      - --auto-truncate
    ports:
      - "127.0.0.1:${RERANK_PORT:-8081}:80"
    volumes:
      - rerank-cache:/data
    restart: unless-stopped

  # 작업 대기열. 가져오기 요청이 여기 쌓이고 worker가 하나씩 꺼낸다
  redis:
    image: redis:8.10.3-alpine
    # appendonly: 재시작해도 대기 중인 작업이 남도록 디스크에 기록한다
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 엔진 API (FastAPI). 경로 검사, 작업 만들기·조회, 진행 스트림. 웹(Rust)이 /api/rag/* 를 여기로 넘긴다
  engine:
    image: rag-ops-engine
    build: ./engine
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    <<: &engine-common
      env_file: .env
      environment:
        # 컨테이너 안에서는 서비스 이름으로 찾아간다 (.env의 값은 Mac에서 쓰는 주소)
        DB_HOST: db
        DB_PORT: "5432"
        EMBED_URL: http://embed:80
        RERANK_URL: http://rerank:80
        REDIS_URL: redis://redis:6379/0
      volumes:
        # 문서 폴더를 Mac과 같은 경로로 읽기 전용 연결한다. 엔진의 경로 검사와 worker가 같은 경로를 본다.
        # INGEST_ROOTS에 폴더가 하나일 때만 이대로 동작한다. 여러 개면 줄을 나눠 적는다
        - ${INGEST_ROOTS}:${INGEST_ROOTS}:ro
        # 평가 질문 파일(eval/questions.jsonl). 웹의 [현재 설정으로 평가]가 읽는다
        - ./eval:/srv/eval:ro
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        embed:
          condition: service_started
      restart: unless-stopped
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 가져오기 worker (Celery). 엔진과 같은 이미지, 실행 명령만 다르다. 문서는 한 번에 하나씩 처리한다 (engine/app/tasks.py)
  worker:
    image: rag-ops-engine
    build: ./engine
    command: ["celery", "-A", "tasks", "worker", "--concurrency=1", "--loglevel=INFO"]
    <<: *engine-common

volumes:
  db-data:
  embed-cache:
  rerank-cache:
  redis-data:
